# Throwaway. Answers three questions the iOS simulator job depends on, and is
# deleted once they are answered: which macOS runner labels this repository can
# actually get, whether an Intel one still exists (an x64-ios vcpkg triplet
# builds for the simulator, an arm64 one does not), and what simulator runtimes
# each runner ships.
name: iOS runner probe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ios
    paths:
      - ".github/workflows/ios-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: probe ${{ matrix.label }}
    runs-on: ${{ matrix.label }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        label:
          - macos-latest
          - macos-13
          - macos-15-intel
    steps:
      - name: What this runner is
        run: |
          echo "label: ${{ matrix.label }}"
          echo "arch: $(uname -m)"
          sw_vers
          xcodebuild -version

      - name: Simulator runtimes and devices
        run: |
          xcrun simctl list runtimes
          echo "--- iPhone device types ---"
          xcrun simctl list devicetypes | grep -i iphone || true

      - name: Rust iOS targets available
        run: |
          rustup target list | grep -i ios || echo "rustup not on this runner"

      - name: vcpkg triplets that name iOS
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: "120deac3062162151622ca4860575a33844ba10b"
          doNotCache: true

      - name: List them
        run: |
          ls "$VCPKG_ROOT/triplets" | grep -i ios || true
          echo "--- community ---"
          ls "$VCPKG_ROOT/triplets/community" | grep -i ios || true
