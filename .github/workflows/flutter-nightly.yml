name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:

# This build publishes its artifacts to the nightly release, so it needs a token
# that can write to the repository's contents. The default workflow token is
# read-only. Same declaration as labdesk-dispatch.yml, for the same reason.
permissions:
  contents: write

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
